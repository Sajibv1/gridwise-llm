name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: gridwise-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: ruff check app tests scripts
      - run: ruff format --check app tests scripts
      - run: pytest

  docker-health:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag gridwise-llm:ci .
      - run: docker run --detach --name gridwise-llm --publish 8000:8000 gridwise-llm:ci
      - run: curl --fail --retry 15 --retry-delay 1 --retry-all-errors http://localhost:8000/health
      - if: always()
        run: docker rm --force gridwise-llm || true

  publish-and-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docker-health
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - id: image
        name: Normalize image name
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        name: Publish tested commit image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}

      - name: Authenticate to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy the immutable image digest
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          OPENAI_MODEL: gpt-5.4-mini-2026-03-17
          OPENAI_REASONING_EFFORT: low
          LLM_TIMEOUT_SECONDS: "7"
          LLM_MAX_RETRIES: "0"
          LLM_SEMANTIC_RETRIES: "1"
        run: |
          az extension add --name containerapp --upgrade --yes
          # A cancelled GitHub run can leave Azure finishing the prior revision.
          # Retry its transient operation-in-progress response rather than treating
          # a healthy application's rollout as a failed deployment.
          for attempt in 1 2 3 4 5 6; do
            if az containerapp update \
              --name gridwise-api-id \
              --resource-group gridwise-fest-rg \
              --image "$IMAGE" \
              --set-env-vars "OPENAI_MODEL=$OPENAI_MODEL" "OPENAI_REASONING_EFFORT=$OPENAI_REASONING_EFFORT" "LLM_TIMEOUT_SECONDS=$LLM_TIMEOUT_SECONDS" "LLM_MAX_RETRIES=$LLM_MAX_RETRIES" "LLM_SEMANTIC_RETRIES=$LLM_SEMANTIC_RETRIES"; then
              exit 0
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "Azure Container Apps update did not finish after six attempts." >&2
              exit 1
            fi
            echo "Azure revision is still provisioning; retrying in 20 seconds (attempt $attempt of 6)."
            sleep 20
          done

      - name: Check deployed public health endpoint
        run: |
          FQDN="$(az containerapp show \
            --name gridwise-api-id \
            --resource-group gridwise-fest-rg \
            --query properties.configuration.ingress.fqdn \
            --output tsv)"
          curl --fail --retry 20 --retry-delay 3 --retry-all-errors "https://${FQDN}/health"
