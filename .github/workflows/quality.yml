name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: ruff check app tests scripts
      - run: ruff format --check app tests scripts
      - run: pytest

  docker-health:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag gridwise-llm:ci .
      - run: docker run --detach --name gridwise-llm --publish 8000:8000 gridwise-llm:ci
      - run: curl --fail --retry 15 --retry-delay 1 --retry-all-errors http://localhost:8000/health
      - if: always()
        run: docker rm --force gridwise-llm || true
